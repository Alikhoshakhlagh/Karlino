      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          default: 10
        description: Number of popular projects
      - name: page
        required: false
        in: query
        description: یک شماره صفحه‌ در مجموعه نتایج صفحه‌بندی شده.
        schema:
          type: integer
      tags:
