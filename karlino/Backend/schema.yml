components:
  schemas:
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        applicant_name:
          type: string
          readOnly: true
        project_title:
          type: string
          readOnly: true
        project_owner_name:
          type: string
          readOnly: true
        project_company_name:
          type: string
          readOnly: true
        cover_letter:
          type: string
        proposed_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - applicant_name
      - cover_letter
      - created_at
      - id
      - project_company_name
      - project_owner_name
      - project_title
      - status
      - updated_at
    ApplicationStatusEnum:
      enum:
      - pending
      - accepted
      - rejected
      - withdrawn
      type: string
      description: |-
        * `pending` - Pending
        * `accepted` - Accepted
        * `rejected` - Rejected
        * `withdrawn` - Withdrawn
    Bid:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        delivery_days:
          type: integer
          maximum: 2147483647
          minimum: 0
        cover_letter:
          type: string
        status:
          $ref: '#/components/schemas/StatusEcbEnum'
        freelancer_id:
          type: string
          format: uuid
          readOnly: true
        freelancer_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - cover_letter
      - created_at
      - delivery_days
      - freelancer_id
      - freelancer_name
      - id
      - updated_at
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
          maxLength: 50
        icon:
          type: string
          maxLength: 100
        resolved_icon:
          type: string
          readOnly: true
      required:
      - id
      - name
      - resolved_icon
      - slug
    Company:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner_email:
          type: string
          format: email
          readOnly: true
        owner_name:
          type: string
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
        website:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        logo:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        phone:
          type: string
          maxLength: 20
        address:
          type: string
          maxLength: 255
        is_verified:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_verified
      - name
      - owner_email
      - owner_name
      - updated_at
    Dashboard:
      type: object
      properties:
        my_projects_count:
          type: integer
        active_projects_count:
          type: integer
        approved_projects_count:
          type: integer
        pending_projects_count:
          type: integer
        needs_revision_projects_count:
          type: integer
        favorites_count:
          type: integer
        my_applications_count:
          type: integer
        my_bids_count:
          type: integer
        pending_review_projects_count:
          type: integer
      required:
      - active_projects_count
      - approved_projects_count
      - favorites_count
      - my_applications_count
      - my_bids_count
      - my_projects_count
      - needs_revision_projects_count
      - pending_projects_count
    ExpertProject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 27
        description:
          type: string
        budget_min:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        budget_max:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        review_status:
          type: string
          readOnly: true
        project_mode:
          type: string
          readOnly: true
        creator_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - creator_name
      - description
      - id
      - project_mode
      - review_status
      - title
    Favorite:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
        project_title:
          type: string
