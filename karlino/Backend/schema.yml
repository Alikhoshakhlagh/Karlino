openapi: 3.0.3
info:
  title: Freelancer Platform API
  version: 1.0.0
  description: Freelancer marketplace backend API
paths:
  /api/applications/incoming/:
    get:
      operationId: applications_incoming_retrieve
      tags:
      - applications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
