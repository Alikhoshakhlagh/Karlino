<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت فریلنسری</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body>

<div id="header-placeholder"></div>

<section class="container-project">

    <section class="project-info">

        <div class="project-avatar">
            <span class="project-avatar__icon">
                <i class="fa-solid fa-code"></i>
            </span>
        </div>

        <div class="project-details">

            <p class="project-title" id="project-title"></p>

            <div class="project-owner">
                <div class="owner-name">
                    <i class="fa-solid fa-user"></i>
                    <span class="owner-text" id="owner-name"></span>
                </div>
            </div>

            <div class="project-bookmark">
                <label for="bookmark-checkbox" class="bookmark">
                    <input type="checkbox" id="bookmark-checkbox"/>
                    <svg class="svgIcon" width="15" viewBox="0 0 50 70" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M46 62.0085L46 3.88139L3.99609 3.88139L3.99609 62.0085L24.5 45.5L46 62.0085Z" stroke="black" stroke-width="7"/>
                    </svg>
                </label>
            </div>
        </div>

        <div class="project-actions">
            <button class="project-submit-btn" id="apply-button">
                <span id="apply-button-text">ارسال درخواست</span>
            </button>
            <h6 class="daysAgo" id="project-days"></h6>
        </div>

    </section>

    <section class="project-about">
        <span id="project-about-text"></span>
    </section>

    <section class="project-skills">
        <div class="title-project-skills">
            <div class="ping"></div>
            <h3>مهارت های مورد نیاز : </h3>
        </div>
        <div class="card-project-skills" id="project-skills-list"></div>
    </section>

    <section class="project-box">
        <div class="box">
            <h3>بودجه</h3>
            <p id="project-budget"></p>
        </div>

        <div class="box">
            <h3>سطح مهارت</h3>
            <p id="project-skill-level"></p>
        </div>

        <div class="box">
            <h3>مهلت انجام</h3>
            <p id="project-deadline"></p>
        </div>
    </section>

    <section class="project-categories">
        <div class="title-project-categories">
            <div class="ping"></div>
            <h3>دسته بندی :</h3>
        </div>
        <div class="card-project-categories" id="project-categories-list"></div>
    </section>

</section>

<div id="footer-placeholder"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/project-detail.js"></script>

</body>
</html>
