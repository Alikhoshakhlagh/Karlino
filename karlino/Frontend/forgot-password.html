<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بازیابی رمز عبور</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

<section class="forgot-password">
    <form class="form" id="forgot-form" novalidate>
        <div class="top-pass">
            <div class="creat-acc">
                <div class="ping"></div>
                <h2>بازیابی رمز عبور</h2>
            </div>
            <p class="message">برای بازیابی حساب، ایمیل خودت رو وارد کن.</p>
        </div>
        <!--email-->
        <label>
            <input class="input" type="email" placeholder="" required="" id="email">
            <span>ایمیل</span>
            <span class="field-error" id="error-email"></span>
        </label>
        <!-- pasword -->
        <label>
            <input class="input" type="password" placeholder="" required="" id="password">
            <span>رمز جدید</span>
            <span class="field-error" id="error-password"></span>
        </label>
        <!-- repasword -->
        <label>
            <input class="input" type="password" placeholder="" required="" id="confirm-password">
            <span>تکرار رمز جدید</span>
            <span class="field-error" id="error-confirmPassword"></span>
        </label>
        
        
        <div class="but-confrim">
            <p class="field-error" id="error-form" style="text-align:center;"></p>
            <button type="submit" class="submit">ثبت رمز جدید</button>
        </div>
    
    </form>
</section>


<script src="js/auth/forget-password.js"></script>
</body>
</html>
