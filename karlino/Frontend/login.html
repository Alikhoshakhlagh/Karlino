<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>login</title>
    <link rel="stylesheet" href="css/main.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body>

<section class="card-login">
    
    <form class="form" id="login-form" novalidate>
        
        <div class="top-login">
            <div class="creat-acc">
                <div class="ping"></div>
                <h2>ورود حساب کاربری</h2>
            </div>
            
            <p class="message">پروژه‌های جدید، همکاری‌های جدید، درآمد بیشتر</p>
        </div>
        
        <!-- email -->
        <label for="email">
            <input class="input" type="email" id="email" placeholder="">
            <span>ایمیل</span>
            <span class="field-error" id="error-email"></span>
        </label>
        
        <!-- password -->
        <label for="password">
            <input class="input" type="password" id="password" placeholder="">
            <span>پسورد</span>
             <span class="field-error" id="error-password"></span>
        </label>
        
        
        <div class="forgetpasword2">
            <p class="forget">
                رمز عبورت رو فراموش کردی؟
                <a href="forgot-password.html">بازیابی</a>
            </p>
        </div>
        
        <div class="bottom-reg">
            
            <button type="submit" class="submit">ورود</button>
            <p class="field-error" id="error-form" style="text-align:center;"></p>
            <p class="signin">
                حساب کاربری ندارید؟
                <a href="register.html">ساخت</a>
            </p>
        </div>
    
    </form>

</section>

<script src="js/auth/login.js"></script>

</body>
</html>
